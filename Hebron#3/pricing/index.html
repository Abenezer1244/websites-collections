<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing | Hebron Care</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        var url = (document.location.origin || "") + "/pricing.html";
        fetch(url, { cache: "no-store" })
          .then(function (r) { return r.text(); })
          .then(function (html) {
            document.open();
            document.write(html);
            document.close();
          })
          .catch(function () {
            document.body.innerHTML = '<div style="max-width:32rem;margin:4rem auto;padding:2rem;text-align:center;font-family:sans-serif;"><p>Unable to load this page. <a href="/pricing.html">Open the pricing page</a> or <a href="/contact/">contact us</a>.</p></div>';
          });
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p style="text-align:center;padding:4rem;"><a href="/pricing.html">Open the pricing page</a></p>
    </noscript>
  </body>
</html>
