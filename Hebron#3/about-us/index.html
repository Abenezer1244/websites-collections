<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Us | Skagit River</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        // Use a relative URL so this wrapper works whether the site root is the repo root or `Hebron#3/`.
        var url = (new URL("../about-us.html", document.location.href)).toString();
        fetch(url, { cache: "no-store" })
          .then(function (r) {
            return r.text();
          })
          .then(function (html) {
            document.open();
            document.write(html);
            document.close();
          })
          .catch(function () {
            document.body.innerHTML =
              '<div style="max-width:32rem;margin:4rem auto;padding:2rem;text-align:center;font-family:sans-serif;"><h1 style="font-size:1.5rem;margin-bottom:1rem;">About Us Skagit River</h1><p style="margin-bottom:1rem;">Unable to load this page. You can:</p><p><a href="/about-us.html" style="color:#A67C52;font-weight:600;">Open the about us page</a></p></div>';
          });
      })();
    </script>
  </head>
  <body>
    <noscript>
      <div style="max-width:32rem;margin:4rem auto;padding:2rem;text-align:center;font-family:sans-serif;">
        <h1 style="font-size:1.5rem;margin-bottom:1rem;">About Us Skagit River</h1>
        <p><a href="/about-us.html">Open the about us page</a></p>
      </div>
    </noscript>
  </body>
</html>
